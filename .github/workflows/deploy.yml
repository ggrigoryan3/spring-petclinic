name: Deploy to EKS

on:
  workflow_run:
    workflows: ["Main Branch Release Pipeline"]
    types:
      - completed

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: spring-petclinic
  EKS_CLUSTER_NAME: capstone-prod-cluster

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Download Release Metadata Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tag
        id: tag
        run: |
          VERSION=$(cat release_version.txt)
          echo "latest_tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Update Chart Metadata & Calculate Chart Version
        id: chart-version
        run: |
          sed -i 's/^appVersion:.*/appVersion: "${{ steps.tag.outputs.latest_tag }}"/' ./helm/petclinic/Chart.yaml
          BASE_VERSION=$(grep '^version:' ./helm/petclinic/Chart.yaml | awk '{print $2}' | tr -d '"')
          MAJOR_VERSION=$(echo "$BASE_VERSION" | cut -d. -f1)
          HELM_REVISION_COUNT=$(git rev-list --count HEAD -- ./helm/petclinic)
          DYNAMIC_CHART_VERSION="${MAJOR_VERSION}.${HELM_REVISION_COUNT}.0"
          sed -i "s/^version:.*/version: \"${DYNAMIC_CHART_VERSION}\"/" ./helm/petclinic/Chart.yaml
          echo "Calculated chart_version=${DYNAMIC_CHART_VERSION}"
          echo "chart_version=${DYNAMIC_CHART_VERSION}" >> $GITHUB_OUTPUT

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy via Helm
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.latest_tag }}
          CHART_VERSION: ${{ steps.chart-version.outputs.chart_version }}
        run: |
          helm upgrade --install petclinic ./helm/petclinic \
            --namespace petclinic \
            --create-namespace \
            --version "${CHART_VERSION}" \
            --set image.repository="${ECR_REGISTRY}/${ECR_REPOSITORY}" \
            --set image.tag="${TAG}" \
            --wait \
            --timeout 10m

      - name: Commit and Push Chart.yaml Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(helm): bump chart version to ${{ steps.chart-version.outputs.chart_version }} and appVersion to ${{ steps.tag.outputs.latest_tag }} [skip ci]"
          file_pattern: 'helm/petclinic/Chart.yaml'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}