name: Main Branch Release Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: spring-petclinic

jobs:
  release-and-push:
    name: SemVer Tag, Build & Push to ECR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python SemVer Dependencies
        run: python -m pip install semver GitPython

      - name: Calculate & Create Next SemVer Tag
        id: semver
        run: |
          cat << 'EOF' > generate_version.py
          import os, git, semver

          try:
              repo = git.Repo('.')
              tags = sorted(repo.tags, key=lambda t: t.commit.committed_datetime)
              latest_tag = str(tags[-1].name) if tags else "v1.0.0"
              
              if latest_tag.startswith('v'):
                  ver = semver.Version.parse(latest_tag[1:])
                  new_ver = f"v{ver.bump_minor()}"
              else:
                  ver = semver.Version.parse(latest_tag)
                  new_ver = str(ver.bump_minor())
          except Exception:
              new_ver = "v1.0.0"

          print(f"Generated Release Version: {new_ver}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"new_version={new_ver}\n")
          EOF
          python generate_version.py

      - name: Push Git Tag to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.semver.outputs.new_version }}
          git push origin ${{ steps.semver.outputs.new_version }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Application Package
        run: mvn -B clean package -DskipTests

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Release Artifact to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          VERSION: ${{ steps.semver.outputs.new_version }}
          SHA: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$SHA \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
            
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Save Version Artifact for Deployment
        run: |
          echo "${{ steps.semver.outputs.new_version }}" > release_version.txt
          echo "${{ github.sha }}" >> release_version.txt
        
      - name: Upload Release Metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release_version.txt